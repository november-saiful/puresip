# ─────────────────────────────────────────────────────────────────────────────
# PureSip API Worker — served under /api/*
# Deploy:  wrangler deploy          (dev/preview bindings from this top level)
#          wrangler deploy --env production
#
# Fill the placeholder IDs below (both sections) with real resource IDs:
#   • Locally:   node scripts/fill-wrangler-ids.mjs --create   (needs `wrangler login`)
#   • Or in CI:  Actions tab → "Deploy" → "Run workflow" — the bootstrap job
#     creates the resources and pushes the filled wrangler.toml automatically.
# ─────────────────────────────────────────────────────────────────────────────
name = "puresip-api"
main = "apps/api/src/index.ts"
compatibility_date = "2025-03-01"

[vars]
DEMO_MODE = "true"
ALLOWED_ORIGINS = "http://localhost:4321,http://127.0.0.1:4321,https://puresip.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "puresip-db"
database_id = "3081ac73-33e4-48e4-bc02-56373cd82225" # filled automatically by scripts/fill-wrangler-ids.mjs
migrations_dir = "packages/db/migrations"

[[kv_namespaces]]
binding = "CART_KV"
id = "afa52b697f5a474fa0f6e6f1f9613c56" # filled automatically by scripts/fill-wrangler-ids.mjs

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "puresip-images"

[env.production]
name = "puresip-api"
main = "apps/api/src/index.ts"
compatibility_date = "2025-03-01"

[env.production.vars]
DEMO_MODE = "false"
ALLOWED_ORIGINS = "https://puresip.pages.dev,https://puresip.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "puresip-db"
database_id = "3081ac73-33e4-48e4-bc02-56373cd82225" # filled automatically by scripts/fill-wrangler-ids.mjs
migrations_dir = "packages/db/migrations"

[[env.production.kv_namespaces]]
binding = "CART_KV"
id = "afa52b697f5a474fa0f6e6f1f9613c56" # filled automatically by scripts/fill-wrangler-ids.mjs

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "puresip-images"
