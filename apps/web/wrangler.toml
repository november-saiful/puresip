# Cloudflare Pages project config for the Astro SSR frontend.
# Deploy from apps/web:  wrangler pages deploy
name = "puresip"
pages_build_output_dir = "dist"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Set these in the Pages dashboard (or via `wrangler pages deploy --var`):
#   API_WORKER_URL = https://puresip-api.<your-subdomain>.workers.dev  (SSR only)
#   PUBLIC_IMAGES_BASE_URL = (optional R2 public URL; leave empty to serve bundled placeholder art)
[vars]
API_WORKER_URL = ""
PUBLIC_IMAGES_BASE_URL = ""
