name: Verify Cloudflare Access

# Run this manually (Actions tab → Run workflow) before the first deploy,
# or whenever you rotate the Cloudflare secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: whoami + permission probes
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Secrets are present
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is not set — repo → Settings → Secrets and variables → Actions → New repository secret"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is not set — find it in the Cloudflare dashboard right sidebar"
            missing=1
          fi
          exit $missing

      - name: Token is valid and matches account (wrangler whoami)
        run: |
          echo "## Cloudflare token verification" > "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if ! npx --yes wrangler@4 whoami | tee /tmp/whoami.txt; then
            echo "::error::Cloudflare rejected the token — check that CLOUDFLARE_API_TOKEN is the full token value and hasn't expired or been deleted."
            exit 1
          fi

          if ! grep -qF "$CLOUDFLARE_ACCOUNT_ID" /tmp/whoami.txt; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID ($CLOUDFLARE_ACCOUNT_ID) is NOT among the accounts this token can access — check for a typo or an account mismatch."
            exit 1
          fi
          echo "✅ Token valid — CLOUDFLARE_ACCOUNT_ID matches an account on the token"
          echo "- ✅ \`whoami\`: token valid, account ID matches" >> "$GITHUB_STEP_SUMMARY"

      - name: Service permissions
        run: |
          probe() {
            local label="$1"; shift
            local log="/tmp/probe-$(echo "$label" | tr ' /' '__').log"
            if "$@" >"$log" 2>&1; then
              echo "✅ $label"
              echo "- ✅ $label" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $label — API said:"
              sed 's/^/    /' "$log"
              echo "- ❌ $label" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          }

          probe "D1    (d1 list)"               npx --yes wrangler@4 d1 list --json
          probe "KV    (kv namespace list)"     npx --yes wrangler@4 kv namespace list
          probe "R2    (r2 bucket list)"        npx --yes wrangler@4 r2 bucket list
          probe "Pages (pages project list)"    npx --yes wrangler@4 pages project list

          if [ -n "$FAILED" ]; then
            echo ""
            echo "::error::One or more Cloudflare services rejected the token. Add the matching permission (Edit level) to the API token, or run this again after fixing."
            exit 1
          fi
          echo ""
          echo "✅ All service checks passed — the deploy workflow can authenticate to every service it uses."
