name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate placeholder images
        run: node scripts/generate-images.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  bootstrap:
    name: Bootstrap Cloudflare resources (run manually)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fill resource IDs into wrangler.toml
        run: node scripts/fill-wrangler-ids.mjs --create

      - name: Print the filled bindings
        if: always()
        run: |
          echo '## wrangler.toml resource IDs' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'database_id|bucket_name|^id ' wrangler.toml >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit filled wrangler.toml back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- wrangler.toml; then
            echo "wrangler.toml unchanged — nothing to commit"
          else
            git add wrangler.toml
            git commit -m "chore: fill Cloudflare resource IDs into wrangler.toml [skip ci]"
            git push
            echo "✅ Pushed filled wrangler.toml — deploys will now use the real resource IDs"
          fi

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate placeholder images
        run: node scripts/generate-images.mjs

      - name: Build frontend
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

      - name: Ensure Pages project exists
        run: npx wrangler pages project create puresip --production-branch main || echo "Pages project already exists"

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply puresip-db --remote

      - name: Seed database (idempotent-ish; safe on fresh DB)
        run: npx wrangler d1 execute puresip-db --remote --file packages/db/seed.sql || echo "seed skipped (already seeded)"

      - name: Deploy API Worker
        run: npx wrangler deploy --env production

      - name: Deploy Pages frontend
        run: npx wrangler pages deploy apps/web/dist --project-name puresip --branch main

  preview:
    name: Preview (PR)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate placeholder images
        run: node scripts/generate-images.mjs
      - name: Build frontend
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      - name: Ensure Pages project exists
        run: npx wrangler pages project create puresip --production-branch main || echo "Pages project already exists"
      - name: Deploy Pages preview
        run: npx wrangler pages deploy apps/web/dist --project-name puresip --branch ${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
